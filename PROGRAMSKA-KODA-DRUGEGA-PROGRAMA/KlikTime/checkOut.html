<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/FontAwesome/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="js/jquery-3.4.1.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/bootbox.all.min.js"></script>
    <script src="js/global.js"></script>
    <script src="js/checkOut.js"></script>
</head>

<body>
    <!--- Middle border --->
    <div class="middleBorder"></div>
    <!--- Bottom link --->
    <div class="bottomLink">www.1klik.com</div>
    <div class="row mainRow">
        <!---------------------------------------------- LEFT SIDE ---------------------------------------------->
        <div class="col side left">
            <!--- Left content --->
            <div class="centerDiv h-100" style="position: relative;">
                <div id="name" class="nameText"></div>
                <div>
                    <div class="row">
                        <div class="col">
                            <div class="checkInText">PRIHOD</div>
                            <div id="checkInTime" class="time"></div>
                            <div id="checkInDate" class="date"></div>
                        </div>
                        <div class="col">
                            <div class="checkInText">TRENUTNI ČAS</div>
                            <div id="currentTime" class="time"></div>
                            <div id="currentDate" class="date"></div>
                        </div>
                    </div>
                    <div class="timeElapsed"></div>
                </div>
            </div>            
        </div>            
        <!---------------------------------------------- RIGHT SIDE ---------------------------------------------->
        <div class="col side right">
            <!--- Right content --->
            <div class="content centerDiv">
                <div>
                    <div id="home" class="buttonConfirm centerDiv noSelect shadowCustom" style="margin: auto; height: 100px;" onclick="confirmClick('home', -514)"><div>DOMOV</div></div>
                    <div class="row" style="margin-top: 30px;">
                        <div class="col centerDiv arrows shadowCustom" onclick="changeClick('left')"><i class="fas fa-arrow-left" style="color: white; font-weight: bold; font-size: 24px;"></i></div>
                        <div class="col" style="min-width: 180px;">
                            <div id="launch" class="buttonConfirm centerDiv noSelect shadowCustom changeable" onclick="confirmClick('launch', -510)" style="height: 100px;position: relative;"><div><div style="font-size:18px; position:absolute; top: 5px; left:0; width: 100%; text-align: center;">IZHOD</div>MALICA</div></div>
                            <div id="work" class="buttonConfirm centerDiv noSelect shadowCustom changeable" onclick="confirmClick('work', -504)" style="height: 100px; display: none;position: relative;"><div><div style="font-size:18px; position:absolute; top: 5px; left:0; width: 100%; text-align: center;">IZHOD</div>SLUŽBENI</div></div>
                            <div id="private" class="buttonConfirm centerDiv noSelect shadowCustom changeable" onclick="confirmClick('private', -505)" style="height: 100px; display: none;position: relative;"><div><div style="font-size:18px; position:absolute; top: 5px; left:0; width: 100%; text-align: center;">IZHOD</div>PRIVATNI</div></div>
                        </div>
                        <div class="col centerDiv arrows shadowCustom" onclick="changeClick('right')"><i class="fas fa-arrow-right" style="color: white; font-weight: bold; font-size: 24px;"></i></div>
                    </div>
                    <div id="cancel" class="buttonCancel centerDiv noSelect shadowCustom" style="margin: auto; margin-top: 30px;" onclick="exitClick()"><div>PREKLIČI<div id="time"></div></div></div>
                </div>
            </div>
        </div>
    </div>    
</body>

</html>
