<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/FontAwesome/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="js/jquery-3.4.1.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/bootbox.all.min.js"></script>
    <script src="js/global.js"></script>
    <script src="js/checkBackIn.js"></script>
</head>

<body>
    <!--- Middle border --->
    <div class="middleBorder"></div>
    <!--- Bottom link --->
    <div class="bottomLink">www.1klik.com</div>
    <div class="row mainRow">
        <!---------------------------------------------- LEFT SIDE ---------------------------------------------->
        <div class="col side left">
            <!--- Left content --->
            <div class="centerDiv h-100" style="position: relative;">
                <div id="name" class="nameText">
                    <div id="type" style="font-weight: normal;"></div>
                </div>
                <div style="margin-top: 20px;">
                    <div class="row">
                        <div class="col">
                            <div class="checkInText">ODHOD</div>
                            <div id="checkOutTime" class="time"></div>
                            <div id="checkOutDate" class="date"></div>
                        </div>
                        <div class="col">
                            <div class="checkInText">PRIHOD</div>
                            <div id="checkInTime" class="time"></div>
                            <div id="checkInDate" class="date"></div>
                        </div>
                    </div>
                    <div class="timeElapsed"></div>
                </div>
            </div>            
        </div>            
        <!---------------------------------------------- RIGHT SIDE ---------------------------------------------->
        <div class="col side right">
            <!--- Right content --->
            <div class="content centerDiv">
                <div>
                    <div id="confirm" class="buttonConfirm centerDiv noSelect shadowCustom" onclick="confirmClick()"><div>POTRDI<div id="time"></div></div></div>
                    <div id="cancel" class="buttonCancel centerDiv noSelect shadowCustom" style="margin-top: 80px;" onclick="exitClick()"><div>PREKLIČI</div></div>
                </div>
            </div>
        </div>
    </div>    
</body>

</html>
